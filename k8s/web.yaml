apiVersion: apps/v1
kind: Deployment
metadata:
  name: web1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web1
  template:
    metadata:
      labels:
        app: web1
    spec:
      containers:
        - name: web
          image: YOUR_DOCKERHUB_USERNAME/k8s-cloud-web:1.0
          ports:
            - containerPort: 5000
          env:
            - name: APP_NAME
              value: Web1
            - name: DB_HOST
              value: mysql-service
            - name: DB_USER
              value: root
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: root-password
            - name: DB_NAME
              value: appdb
---
apiVersion: v1
kind: Service
metadata:
  name: web1-service
spec:
  type: NodePort
  selector:
    app: web1
  ports:
    - port: 80
      targetPort: 5000
      nodePort: 30081
---
